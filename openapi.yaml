openapi: 3.1.0
info:
  title: Xiaxia Reality and Hand API
  version: 1.1.0
  description: >-
    Read Xiaxia Reality, Phone and Spatial context, manage personal places,
    create strictly whitelisted Xiaxia Hand commands, and request an on-demand
    Xiaxia Eye screen observation.

servers:
  - url: https://xiaxia-sense-server.onrender.com

security:
  - bearerAuth: []

paths:
  /ping:
    get:
      operationId: getSenseHealth
      summary: Check Reality Server health
      security: []
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /context:
    get:
      operationId: getFullSenseContext
      summary: Read the complete sensor and interpreted context
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reality/context:
    get:
      operationId: getRealityContext
      summary: Read the complete Reality context
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reality/summary:
    get:
      operationId: getRealitySummary
      summary: Read compact Reality summaries and inferences
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reality/environment:
    get:
      operationId: getRealityEnvironment
      summary: Read environment and weather reality
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reality/device:
    get:
      operationId: getRealityDevice
      summary: Read device power and network reality
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reality/location:
    get:
      operationId: getRealityLocation
      summary: Read location and mobility reality
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reality/phone:
    get:
      operationId: getPhoneActivity
      summary: Read current Phone Activity
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reality/phone/timeline:
    get:
      operationId: getPhoneTimeline
      summary: Read the recent Phone Activity timeline
      parameters:
        - name: minutes
          in: query
          description: Lookback window in minutes.
          schema:
            type: integer
            minimum: 1
            maximum: 2880
            default: 60
        - name: limit
          in: query
          description: Maximum number of timeline events.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reality/phone/history:
    get:
      operationId: getPhoneHistory
      summary: Read summarized short-term Phone Activity history
      parameters:
        - name: minutes
          in: query
          description: Relative lookback, or the window before end.
          schema:
            type: integer
            minimum: 1
            maximum: 2880
            default: 60
        - name: start
          in: query
          description: Optional ISO 8601 start datetime.
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: Optional ISO 8601 end datetime.
          schema:
            type: string
            format: date-time
        - name: types
          in: query
          description: History categories, or all.
          schema:
            type: string
            default: all
        - name: include_timeline
          in: query
          description: Include filtered raw timeline events.
          schema:
            type: boolean
            default: false
        - name: timeline_limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reality/spatial:
    get:
      operationId: getSpatialReality
      summary: Read current Spatial Reality
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reality/spatial/history:
    get:
      operationId: getSpatialHistory
      summary: Read recent location history and movement analysis
      parameters:
        - name: minutes
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2880
            default: 30
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reality/spatial/nearby:
    get:
      operationId: findNearbyPlaces
      summary: Search nearby Amap POIs from the current location
      parameters:
        - name: keywords
          in: query
          schema:
            type: string
        - name: types
          in: query
          schema:
            type: string
        - name: radius
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1000
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reality/spatial/route:
    get:
      operationId: getSpatialRoute
      summary: Plan a route with the existing Spatial and Amap capability
      description: >-
        Use one destination form: a personal place name, an Amap POI location,
        or WGS84 latitude and longitude.
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [walking, driving, cycling, electrobike]
            default: walking
        - name: place
          in: query
          description: Saved personal place name.
          schema:
            type: string
        - name: poi_location
          in: query
          description: Amap GCJ-02 longitude,latitude string.
          schema:
            type: string
        - name: poi_name
          in: query
          schema:
            type: string
        - name: latitude
          in: query
          description: WGS84 destination latitude.
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          description: WGS84 destination longitude.
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /reality/spatial/places:
    get:
      operationId: listPersonalPlaces
      summary: List saved Personal Places and current relations
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: savePersonalPlace
      summary: Save or update a Personal Place
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalPlaceRequest"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /reality/spatial/places/from-poi:
    post:
      operationId: savePersonalPlaceFromPoi
      summary: Save a Personal Place from an Amap POI
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalPlaceFromPoiRequest"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reality/spatial/places/{name}:
    get:
      operationId: getPersonalPlace
      summary: Read one Personal Place
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deletePersonalPlace
      summary: Delete one Personal Place
      x-openai-isConsequential: true
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reality/status:
    get:
      operationId: getRealityStatus
      summary: Read sensor freshness and service status
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hand/commands:
    post:
      operationId: createHandCommand
      summary: Create one strictly whitelisted Android action command
      description: >-
        Creates a semantic command only. Tasker performs the Android action.
        Never use this operation for an action outside the declared whitelist.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandCommandRequest"
      responses:
        "201":
          description: Command created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandCreateResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hand/commands/{command_id}:
    get:
      operationId: getHandCommandStatus
      summary: Read the current status of a Hand command
      parameters:
        - name: command_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current command state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandCommand"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /eye/requests:
    post:
      operationId: createEyeScreenRequest
      summary: Ask Xiaxia Eye to observe the current Android screen once
      description: >-
        Creates one on-demand screen observation request. The device captures
        only after receiving this request; this operation never starts
        continuous screenshots or recording.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EyeScreenRequest"
      responses:
        "201":
          description: Eye request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EyeCreateResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /eye/requests/{request_id}:
    get:
      operationId: getEyeScreenRequest
      summary: Read an Eye request status and structured visual facts
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current Eye request state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EyeRequest"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    JsonResponse:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    ErrorResponse:
      description: Request error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [error]
      additionalProperties: true

    PersonalPlaceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        kind:
          type: string
          default: custom
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radius_m:
          type: number
          exclusiveMinimum: 0
          default: 150
        note:
          type: string
        use_current_location:
          type: boolean
      required: [name]
      additionalProperties: false

    PersonalPlaceFromPoiRequest:
      type: object
      properties:
        name:
          type: string
        poi_name:
          type: string
        poi_location:
          type: string
          description: Amap GCJ-02 longitude,latitude.
        poi_type:
          type: string
        poi_address:
          type: string
        poi_id:
          type: string
        kind:
          type: string
          default: custom
        radius_m:
          type: number
          exclusiveMinimum: 0
          default: 150
        note:
          type: string
        poi:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            type:
              type: string
            address:
              type: string
            location:
              type: string
          additionalProperties: false
      additionalProperties: false

    HandCommandRequest:
      type: object
      description: >-
        Semantic Android command. The action determines which parameter fields
        are valid. The server strictly validates the action/parameter pairing
        before persisting a command.
      properties:
        action:
          type: string
          enum:
            - flashlight
            - volume
            - open_app
            - timer
            - alarm
            - do_not_disturb
            - battery_saver
            - navigation
            - knock
        parameters:
          type: object
          description: Parameters for the selected action.
          properties:
            state:
              type: string
              enum: ["on", "off"]
              description: Used by flashlight, do_not_disturb, and battery_saver.
            stream:
              type: string
              enum: [media]
              description: Used by volume.
            level:
              type: integer
              minimum: 0
              maximum: 100
              description: Used by volume.
            app:
              type: string
              minLength: 1
              maxLength: 120
              description: Used by open_app.
            duration_seconds:
              type: integer
              minimum: 1
              maximum: 604800
              description: Used by timer.
            label:
              type: string
              maxLength: 200
              description: Optional label used by timer or alarm.
            time:
              type: string
              pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d$"
              description: Used by alarm; device-local 24-hour HH:MM.
            destination:
              type: string
              minLength: 1
              maxLength: 500
              description: Used by navigation.
            latitude:
              type: number
              minimum: -90
              maximum: 90
              description: Optional navigation destination latitude.
            longitude:
              type: number
              minimum: -180
              maximum: 180
              description: Optional navigation destination longitude.
            place_id:
              type: string
              minLength: 1
              maxLength: 200
              description: Optional saved place identifier for navigation.
            travel_mode:
              type: string
              enum: [walking, driving, cycling, electrobike]
              description: Optional navigation travel mode.
            pattern:
              type: string
              enum: [xiaxia]
              description: Used by knock; V1.1 supports only xiaxia.
          additionalProperties: false
      required: [action, parameters]
      additionalProperties: false

    HandCreateResponse:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
        status:
          type: string
          const: pending
      required: [command_id, status]
      additionalProperties: false

    EyeScreenRequest:
      type: object
      description: One explicit, on-demand request to observe the current screen.
      properties:
        frame_count:
          type: integer
          enum: [1]
          default: 1
          description: Screen Sense V1 captures exactly one frame.
        focus:
          type: string
          maxLength: 300
          description: Optional question or visual area to pay attention to.
      additionalProperties: false

    EyeCreateResponse:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
          const: pending
        expires_at:
          type: string
          format: date-time
      required: [request_id, status, expires_at]
      additionalProperties: false

    EyeRequest:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        request_type:
          type: string
          const: screen
        frame_count:
          type: integer
        focus:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, capturing, uploaded, analyzing, completed, failed, expired]
        created_at:
          type: string
          format: date-time
        claimed_at:
          type: string
          format: date-time
          nullable: true
        uploaded_at:
          type: string
          format: date-time
          nullable: true
        analysis_started_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        result_expires_at:
          type: string
          format: date-time
          nullable: true
        visual_facts:
          type: object
          nullable: true
          properties:
            scene:
              type: string
            visible_people:
              type: array
              items:
                type: string
            actions:
              type: array
              items:
                type: string
            objects:
              type: array
              items:
                type: string
            screen_text:
              type: array
              items:
                type: string
            uncertainties:
              type: array
              items:
                type: string
          required:
            - scene
            - visible_people
            - actions
            - objects
            - screen_text
            - uncertainties
          additionalProperties: false
        error:
          type: object
          nullable: true
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
          additionalProperties: false
      required:
        - request_id
        - request_type
        - frame_count
        - focus
        - status
        - created_at
        - claimed_at
        - uploaded_at
        - analysis_started_at
        - updated_at
        - expires_at
        - completed_at
        - result_expires_at
        - visual_facts
        - error
      additionalProperties: false

    HandCommand:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - flashlight
            - volume
            - open_app
            - timer
            - alarm
            - do_not_disturb
            - battery_saver
            - navigation
            - knock
        parameters:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [pending, delivered, executed, failed, expired]
        created_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
          nullable: true
        executed_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        result:
          type: object
          nullable: true
          additionalProperties: true
        error:
          type: string
          nullable: true
      required:
        - command_id
        - action
        - parameters
        - status
        - created_at
        - delivered_at
        - executed_at
        - expires_at
        - result
        - error
      additionalProperties: false
