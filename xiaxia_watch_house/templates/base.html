<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}夏夏共影小屋{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('web.watch_library') }}">
      <span class="brand-mark">夏</span>
      <span>共影小屋</span>
    </a>
    {% if session.get('web_authenticated') %}
    <form method="post" action="{{ url_for('web.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="ghost small" type="submit">退出</button>
    </form>
    {% endif %}
  </header>
  <main class="page-shell">{% block content %}{% endblock %}</main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
